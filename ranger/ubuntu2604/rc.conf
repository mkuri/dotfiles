# Ubuntu 26.04 version of ../rc.conf.
# Only the differences from the default rc.conf, which ranger loads first.
set show_hidden true

# Preview text files with ranger itself instead of scope.sh. scope.sh runs
# file(1) on every highlighted file, and file 5.46 on 26.04 reads 14MiB of
# each one, which stalls ranger on slow disks.
set use_preview_script false
