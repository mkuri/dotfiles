# Key bindings for viewing images with mpv, loaded with --input-conf only by
# the image opener in yazi/yazi.toml. Video and audio keep the default
# bindings. Bindings not listed here fall back to mpv's built-in ones.

RIGHT playlist-next
LEFT  playlist-prev
l     playlist-next
h     playlist-prev
SPACE playlist-next
DOWN  playlist-next
UP    playlist-prev
