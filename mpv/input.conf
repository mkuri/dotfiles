# Key bindings for mpv, loaded from the default input.conf location. The image
# opener in yazi/yazi.toml replaces this file with image-input.conf, so keep
# shared bindings in both. Bindings not listed here fall back to mpv's
# built-in ones.

# Maximize the window instead of entering native fullscreen; double-click
# still toggles fullscreen.
f cycle window-maximized
