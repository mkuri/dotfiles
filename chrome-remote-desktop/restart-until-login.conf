# Drop-in for chrome-remote-desktop@.service.
# Install as /etc/systemd/system/chrome-remote-desktop@.service.d/restart-until-login.conf
#
# The service starts at boot, before anyone logs in to GNOME on the console.
# With the mirror patch there is no X display to attach to yet, so the host
# exits with "No X11 display owned by this user" and stays failed. Keep
# retrying until the console login exists (also covers logout → login).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30
